<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#000"/>
    </marker>
    <style>
      .dg-box { fill: #fff; stroke: #000; stroke-width: 1; }
      .dg-t { font-size: 14.5px; fill: #000; text-anchor: middle; }
      .dg-s { font-size: 12px; fill: #000; text-anchor: middle; font-style: italic; }
      .dg-l { font-size: 12px; fill: #000; font-style: italic; }
      .dg-arrow { stroke: #000; stroke-width: 1; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <!-- request path -->
  <rect class="dg-box" x="8" y="146" width="92" height="48"/>
  <text class="dg-t" x="54" y="168">Client</text><text class="dg-s" x="54" y="184">application</text>

  <rect class="dg-box" x="122" y="146" width="84" height="48"/>
  <text class="dg-t" x="164" y="168">nginx</text><text class="dg-s" x="164" y="184">reverse proxy</text>

  <rect class="dg-box" x="228" y="146" width="100" height="48"/>
  <text class="dg-t" x="278" y="168">Rate limiter</text><text class="dg-s" x="278" y="184">per caller</text>

  <rect class="dg-box" x="350" y="146" width="104" height="48"/>
  <text class="dg-t" x="402" y="168">Cheap label</text><text class="dg-s" x="402" y="184">keyword rules</text>

  <rect class="dg-box" x="476" y="138" width="154" height="64"/>
  <text class="dg-t" x="553" y="160">Cache lookup</text>
  <text class="dg-s" x="553" y="176">filtered on stored verdict</text>
  <text class="dg-s" x="553" y="191">and label; &#964; = 0.85 / 0.95</text>

  <!-- hit -->
  <rect class="dg-box" x="672" y="34" width="124" height="48"/>
  <text class="dg-t" x="734" y="56">Re-check</text><text class="dg-s" x="734" y="72">injection filter</text>

  <rect class="dg-box" x="818" y="34" width="104" height="48"/>
  <text class="dg-t" x="870" y="56">Output guard</text><text class="dg-s" x="870" y="72">pattern scan</text>

  <rect class="dg-box" x="950" y="146" width="84" height="48"/>
  <text class="dg-t" x="992" y="168">Response</text><text class="dg-s" x="992" y="184">to client</text>

  <!-- miss -->
  <rect class="dg-box" x="476" y="262" width="110" height="48"/>
  <text class="dg-t" x="531" y="284">Injection filter</text><text class="dg-s" x="531" y="300">+ PII scan</text>

  <rect class="dg-box" x="600" y="262" width="96" height="48"/>
  <text class="dg-t" x="648" y="284">Model picker</text><text class="dg-s" x="648" y="300">cheap / strong</text>

  <rect class="dg-box" x="710" y="262" width="100" height="48"/>
  <text class="dg-t" x="760" y="284">LLM provider</text><text class="dg-s" x="760" y="300">with fallback</text>

  <rect class="dg-box" x="824" y="262" width="96" height="48"/>
  <text class="dg-t" x="872" y="284">Output guard</text><text class="dg-s" x="872" y="300">pattern scan</text>

  <rect class="dg-box" x="934" y="262" width="100" height="48"/>
  <text class="dg-t" x="984" y="284">Store entry</text><text class="dg-s" x="984" y="300">answer + verdict</text>

  <!-- arrows -->
  <path class="dg-arrow" d="M100,170 H120"/>
  <path class="dg-arrow" d="M206,170 H226"/>
  <path class="dg-arrow" d="M328,170 H348"/>
  <path class="dg-arrow" d="M454,170 H474"/>
  <path class="dg-arrow" d="M610,138 V58 H670"/>
  <text class="dg-l" x="618" y="50">hit</text>
  <path class="dg-arrow" d="M796,58 H816"/>
  <path class="dg-arrow" d="M922,58 H992 V144"/>
  <path class="dg-arrow" d="M531,202 V260"/>
  <text class="dg-l" x="539" y="236">miss</text>
  <path class="dg-arrow" d="M586,286 H598"/>
  <path class="dg-arrow" d="M696,286 H708"/>
  <path class="dg-arrow" d="M810,286 H822"/>
  <path class="dg-arrow" d="M920,286 H932"/>
  <path class="dg-arrow" d="M984,262 V196"/>
  <path d="M630,170 H946" stroke="#000" stroke-width="1" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text class="dg-l" x="788" y="161" text-anchor="middle">baseline: hit served without screening</text>

  <!-- log -->
  <rect class="dg-box" x="122" y="326" width="912" height="28"/>
  <text x="578" y="345" font-size="12px" text-anchor="middle">Request log: one JSON line per request (outcome, stage timings, cost, whether screening ran, configuration)</text>
</svg>
