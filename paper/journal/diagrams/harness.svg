<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 290" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#000"/>
    </marker>
    <style>
      .dg-box { fill: #fff; stroke: #000; stroke-width: 1; }
      .dg-t { font-size: 14.5px; fill: #000; text-anchor: middle; }
      .dg-s { font-size: 12px; fill: #000; text-anchor: middle; font-style: italic; }
      .dg-arrow { stroke: #000; stroke-width: 1; fill: none; marker-end: url(#h); }
    </style>
  </defs>

  <text x="8" y="14" font-size="12px" font-style="italic">(a) Inputs, generated once</text>
  <rect class="dg-box" x="8" y="24" width="168" height="54"/>
  <text class="dg-t" x="92" y="46">Public datasets</text><text class="dg-s" x="92" y="63">deepset, jayavibhav</text>

  <rect class="dg-box" x="208" y="24" width="150" height="54"/>
  <text class="dg-t" x="283" y="46">Seeds</text><text class="dg-s" x="283" y="63">{{n_seeds}} attacks</text>

  <rect class="dg-box" x="390" y="24" width="226" height="54"/>
  <text class="dg-t" x="503" y="46">Variants</text><text class="dg-s" x="503" y="63">{{n_lazy}} lazy edits, {{n_rewrite}} paraphrases</text>

  <rect class="dg-box" x="648" y="24" width="160" height="54"/>
  <text class="dg-t" x="728" y="46">Honest controls</text><text class="dg-s" x="728" y="63">{{n_controls}} questions</text>

  <rect class="dg-box" x="840" y="24" width="192" height="54"/>
  <text class="dg-t" x="936" y="46">Filter test sets (E4)</text><text class="dg-s" x="936" y="63">{{scr_honest_n}} honest, {{scr_attack_n}} attacks</text>

  <path class="dg-arrow" d="M176,51 H206"/>
  <path class="dg-arrow" d="M358,51 H388"/>

  <text x="8" y="124" font-size="12px" font-style="italic">(b) Each experiment arm</text>
  <rect class="dg-box" x="8" y="134" width="150" height="62"/>
  <text class="dg-t" x="83" y="157">Restart gateway</text><text class="dg-s" x="83" y="174">with the arm's settings;</text><text class="dg-s" x="83" y="188">config checked</text>

  <rect class="dg-box" x="190" y="134" width="270" height="62"/>
  <text class="dg-t" x="325" y="157">For each seed</text>
  <text class="dg-s" x="325" y="174">clear cache, plant one poisoned entry,</text>
  <text class="dg-s" x="325" y="188">send every variant over HTTP</text>

  <rect class="dg-box" x="492" y="134" width="166" height="62"/>
  <text class="dg-t" x="575" y="157">Join</text><text class="dg-s" x="575" y="174">reply + gateway log line</text><text class="dg-s" x="575" y="188">by request id</text>

  <rect class="dg-box" x="690" y="134" width="170" height="62"/>
  <text class="dg-t" x="775" y="157">Classify</text><text class="dg-s" x="775" y="174">bypass, poison served,</text><text class="dg-s" x="775" y="188">cache-caused or filter miss</text>

  <rect class="dg-box" x="892" y="134" width="140" height="62"/>
  <text class="dg-t" x="962" y="157">Report</text><text class="dg-s" x="962" y="174">bootstrap intervals,</text><text class="dg-s" x="962" y="188">tables and figures</text>

  <path class="dg-arrow" d="M158,165 H188"/>
  <path class="dg-arrow" d="M460,165 H490"/>
  <path class="dg-arrow" d="M658,165 H688"/>
  <path class="dg-arrow" d="M860,165 H890"/>
  <path class="dg-arrow" d="M503,78 V106 H325 V132"/>
  <path class="dg-arrow" d="M728,78 V106 H340 V132"/>

  <rect class="dg-box" x="190" y="232" width="468" height="44"/>
  <text class="dg-t" x="424" y="251">Gateway under test</text>
  <text class="dg-s" x="424" y="267">real injection filter, embedder, Qdrant and Redis; mocked model reply</text>
  <path class="dg-arrow" d="M325,196 V230"/>
  <path class="dg-arrow" d="M575,230 V198"/>
</svg>
